name: Conformity

# Continuous conformity, site tier, for tychat.io. The checks come from the
# composite action in uncovertechtalent/machinebehavior.io. They run on every
# pull request to main (the required check before a merge), on every push to
# main before the Pages deploy, weekly, and by hand. A failing check blocks the
# deploy and the previous build stays live. On main, the run record goes back to
# main as a bot commit pushed with a deploy key that only the main-push
# environment holds. Pull request runs, manual runs from another branch, and
# runs without the key commit nothing. After each deploy, the changed URLs go
# to IndexNow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

# Each job asks for its own permissions; the workflow grants none.
permissions: {}

concurrency:
  group: conformity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformity:
    # This name is the required status check in the ruleset on main: renaming the job blocks every merge until the
    # ruleset names the new check.
    name: Conformity checks
    runs-on: ubuntu-latest
    permissions:
      contents: read    # check out the repository
    outputs:
      record: ${{ steps.record.outcome }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request run checks the merge result of the pull request; every other run checks main.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the checked commit
        # The record job refuses to commit if main gained a newer run record after this commit.
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the checks
        uses: uncovertechtalent/machinebehavior.io/.github/actions/conformity@ad371edc1b959ac561a92b17d81f52712aa4b4fb # machinebehavior.io conformity, main at 2026-10-11
        with:
          root: .
          config: conformity/site-tier.json
          requirements: conformity/requirements.json
          out: conformity

      - name: Hand latest.json and the page to the record job
        # Only on main. Before the gate, so a failed run is recorded too.
        id: record
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformity-page-${{ github.run_id }}
          path: |
            conformity/latest.json
            conformity/index.html
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Gate
        run: |
          result=$(cat conformity/.result)
          echo "overall: $result"
          if [ "$result" != "pass" ]; then
            echo "::error::conformity checks failed; deploy blocked, previous build stays live"
            exit 1
          fi

  record:
    name: Commit the run record
    # The only job that can write to main. The deploy key CONFORMITY_PUSH_KEY is a secret of the main-push
    # environment, whose deployment branch policy allows main only, so a run from any other ref never receives it.
    # The branch rules on main let the deploy key through; the workflow token stays read-only. The job runs after a
    # failed check too (the history keeps failed runs), on main only. Without the key it is a dry run: it shows the
    # change and pushes nothing.
    needs: conformity
    if: ${{ !cancelled() && needs.conformity.outputs.record == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a hung push would otherwise hold the main concurrency group for hours
    environment:
      name: main-push
      deployment: false   # a secret store, not a deploy target: no deployment record (IndexNow reads github-pages only)
    permissions:
      contents: read    # check out main; the push goes over SSH with the deploy key
    steps:
      - name: Checkout main  # zizmor: ignore[artipacked] the push below uses the persisted deploy key (.github/zizmor.yml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Empty without the secret: checkout then reads over HTTPS with the read-only workflow token.
          ssh-key: ${{ secrets.CONFORMITY_PUSH_KEY }}

      - name: Check that main has no newer run record
        # A re-run of this job alone reuses this run's artifact, which would overwrite a newer record on main.
        env:
          BASE: ${{ needs.conformity.outputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::error::no checked commit from the conformity job; re-run all jobs"
            exit 1
          fi
          newer=$(git log --format=%H "$BASE..HEAD" -- conformity/latest.json)
          if [ -n "$newer" ]; then
            echo "::error::main has a newer run record than this run's ($newer); re-run all jobs, not only this one"
            exit 1
          fi

      - name: Fetch latest.json and the page
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformity-page-${{ github.run_id }}
          path: conformity

      - name: Commit and push
        env:
          HAS_KEY: ${{ secrets.CONFORMITY_PUSH_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "conformity-bot"
          git config user.email "conformity-bot@users.noreply.github.com"
          git add conformity/latest.json conformity/index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git diff --cached --stat
          if [ "$HAS_KEY" != true ]; then
            echo "::warning::dry run: CONFORMITY_PUSH_KEY is not set in the main-push environment; the run record was not pushed"
            exit 0
          fi
          # [skip ci] is required: a push with the deploy key starts workflows (a workflow token push does not), so
          # without it every bot commit would start another run.
          git commit -m "conformity: run $(date -u +%Y-%m-%dT%H:%M:%SZ) ($EVENT) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy to Pages
    # After the bot commit, so the deployed /conformity/ page is this run's.
    needs: [conformity, record]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read    # check out main after the bot commit
      pages: write      # deploy to Pages
      id-token: write   # the OIDC token deploy-pages needs
    outputs:
      sha: ${{ steps.deployed.outputs.sha }}
    steps:
      - name: Checkout (after the bot commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Record the deployed commit
        # The IndexNow job submits the URLs that changed up to this commit.
        id: deployed
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Submit changed URLs to IndexNow
    # After each successful deploy: the URLs that changed since the last successful github-pages deployment before
    # this run, plus the sitemap, go to the IndexNow endpoint, which shares them with Bing and the other engines that
    # take part. Starting from that deployment covers pushes whose own run failed or was cancelled. The job never fails
    # the run: the deploy is already live, and a refused submission only waits for the next crawl.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read      # check out the deployed commit with its history, for the diff
      deployments: read   # find the last successful github-pages deployment, the start of the range
    steps:
      - name: Checkout (the deployed commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test the URL selection
        # On the checkout this job uses: a failing test stops the job before anything is submitted.
        run: python3 scripts/test_indexnow.py

      - name: Find the start of the range
        # The newest github-pages deployment with a success status, other than this run's own (deployments carry the
        # run's GITHUB_SHA). Without one, a push falls back to the commit before the push.
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          start=""
          own_skipped=""
          if deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id) \(.sha)"' 2>"$RUNNER_TEMP/gh.err"); then
            while read -r id sha; do
              if [ -z "$id" ]; then continue; fi
              # Skip this run's own deployment, the newest of its commit (the concurrency group runs one deploy at a
              # time). An earlier deployment of the same commit, from a scheduled or manual run, counts as the start.
              if [ "$sha" = "$GITHUB_SHA" ] && [ -z "$own_skipped" ]; then own_skipped=1; continue; fi
              if ok=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=30" --jq 'any(.[]; .state == "success")' 2>"$RUNNER_TEMP/gh.err"); then
                if [ "$ok" = true ]; then
                  start="$sha"
                  echo "range start: $sha, the last successful deployment before this run"
                  break
                fi
              else
                echo "::warning::IndexNow: status lookup of deployment $id failed: $(tr -d '\n' < "$RUNNER_TEMP/gh.err" | head -c 300)"
              fi
            done <<< "$deployments"
          else
            echo "::warning::IndexNow: deployments lookup failed: $(tr -d '\n' < "$RUNNER_TEMP/gh.err" | head -c 300)"
          fi
          if [ -z "$start" ] && [ -n "${BEFORE:-}" ]; then
            start="$BEFORE"
            echo "range start: $start, the commit before the push (no successful deployment from the API)"
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow
        # scripts/indexnow.py writes the request body (host, key, keyLocation, urlList). The key is public by design:
        # engines fetch it from the site root. 200 means submitted, 202 received with the key check pending.
        env:
          START: ${{ steps.range.outputs.start }}
          DEPLOYED: ${{ needs.deploy.outputs.sha }}
        run: |
          if [ -z "$START" ]; then
            echo "::warning::IndexNow: no start for the range; nothing submitted"
            exit 0
          fi
          rc=0
          python3 scripts/indexnow.py git "$START" "$DEPLOYED" "$RUNNER_TEMP/indexnow.json" || rc=$?
          if [ "$rc" = 3 ]; then
            exit 0
          elif [ "$rc" != 0 ]; then
            echo "::warning::IndexNow: no URL list (exit $rc); nothing submitted"
            exit 0
          fi
          rm -f "$RUNNER_TEMP/indexnow.out"
          status=$(curl -sS --max-time 30 --retry 2 -o "$RUNNER_TEMP/indexnow.out" -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$RUNNER_TEMP/indexnow.json" https://api.indexnow.org/indexnow) || true
          echo "IndexNow HTTP ${status:-000}"
          case "${status:-000}" in
            200|202) echo "IndexNow accepted the URLs" ;;
            *) echo "::warning::IndexNow returned HTTP ${status:-000}; the deploy is live, the URLs were not accepted"
               head -c 500 "$RUNNER_TEMP/indexnow.out" 2>/dev/null || true ;;
          esac
