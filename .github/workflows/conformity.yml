name: Conformity

# Continuous conformity, site tier, for tychat.io. The checks come from the
# composite action in uncovertechtalent/machinebehavior.io. They run on every
# push to main before the Pages deploy, weekly, and by hand. A failing check
# blocks the deploy and the previous build stays live.

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: conformity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformity:
    name: Conformity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Run the checks
        uses: uncovertechtalent/machinebehavior.io/.github/actions/conformity@d5a242f0e5db2a5baba1d48a84a056ac55e3cae2 # machinebehavior.io conformity, main at 2026-10-11
        with:
          root: .
          config: conformity/site-tier.json
          requirements: conformity/requirements.json
          out: conformity

      - name: Commit latest.json and the page
        run: |
          git config user.name "conformity-bot"
          git config user.email "conformity-bot@users.noreply.github.com"
          git add conformity/latest.json conformity/index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "conformity: run $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ github.event_name }}) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Gate
        run: |
          result=$(cat conformity/.result)
          echo "overall: $result"
          if [ "$result" != "pass" ]; then
            echo "::error::conformity checks failed; deploy blocked, previous build stays live"
            exit 1
          fi

  deploy:
    name: Deploy to Pages
    needs: conformity
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (after the bot commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
